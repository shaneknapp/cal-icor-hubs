name: Deploy jupyterhub-home-nfs helm chart
# use echo ${VAR##*: } to get the value of a variable that is a string with a colon in it
permissions:
  contents: read
  id-token: write  # mint the OIDC token for the keyless WIF login canary
on:
  workflow_dispatch:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR labels
        id: pr-labels
        uses: irby/get-labels-on-push@v1.2.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out the hub repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1  # OR "2" -> To retrieve the preceding commit.
          sparse-checkout: |
            jupyterhub-home-nfs/
            deployments/jupyter/secrets/
            .sops.yaml

      # Canary for the keyless-auth cutover, placed BEFORE the label check (and
      # unguarded) so it runs on every staging push regardless of whether the chart
      # deploys. Proves keyless WIF login (prod-deploy@ impersonation) works here.
      # Non-fatal. Next PR: move this into the deploy path and drop the GKE_KEY/SOPS
      # key path.
      - name: Log in to Google Cloud via WIF (canary, non-fatal)
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_DEPLOY_SA }}

      - name: Check if the jupyterhub-home-nfs helm chart needs to be deployed
        run: |
          echo "PR labels: ${{ steps.pr-labels.outputs.labels }}"
          for label in $(echo -e "${{ steps.pr-labels.outputs.labels }}"); do
            if [[ "$label" == jupyterhub-home-nfs-deployment ]]; then
              echo "Deploying jupyterhub-home-nfs charts!"
              echo "DEPLOY=1" >> "$GITHUB_ENV"
            fi
          done

      - name: Auth to gcloud
        if: ${{ env.DEPLOY }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install Google Cloud SDK
        if: ${{ env.DEPLOY }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Install SOPS
        if: ${{ env.DEPLOY }}
        uses: ./.github/actions/install-sops

      - name: Activate credentials for cluster
        if: ${{ env.DEPLOY }}
        run: |
          sops -d -i deployments/jupyter/secrets/gke-key.json
          gcloud auth \
            activate-service-account \
            --key-file deployments/jupyter/secrets/gke-key.json
          gcloud container clusters \
            --region=us-central1 --project=cal-icor-hubs \
            get-credentials spring-2025

      - name: Decrypt jupyterhub-home-nfs secrets
        if: ${{ env.DEPLOY }}
        run: |
          sops -d -i jupyterhub-home-nfs/secrets/quota-overrides.yaml

      - name: Deploy jupyterhub-home-nfs helm chart
        if: ${{ env.DEPLOY }}
        run: |
          helm dep up jupyterhub-home-nfs
          helm upgrade --install \
            --namespace jupyterhub-home-nfs \
            --create-namespace jupyterhub-home-nfs \
            --values jupyterhub-home-nfs/values.yaml \
            --values jupyterhub-home-nfs/secrets/quota-overrides.yaml \
            jupyterhub-home-nfs
