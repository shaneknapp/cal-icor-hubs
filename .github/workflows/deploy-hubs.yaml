# This workflow will determine if the base hub image and/or single-user server
# image for any or all hubs has has changed, and if so, deploy accordingly.
#
# Deployments are parallelized via a matrix build. A lightweight "determine"
# job resolves the hub list and outputs it as a JSON array; the deploy job
# fans out one runner per hub with fail-fast disabled so a single failure does
# not cancel the remaining deployments.
#
name: Deploy staging and prod hubs
permissions:
  contents: read
  pull-requests: read
  id-token: write  # mint the OIDC token for the keyless WIF login canary
on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - prod

jobs:
  # ---------------------------------------------------------------------------
  # Staging
  # ---------------------------------------------------------------------------
  determine-staging-hubs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    outputs:
      hubs: ${{ steps.set-hubs.outputs.hubs }}
    steps:
      - name: Get PR labels
        id: pr-labels
        uses: irby/get-labels-on-push@v1.2.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Canary for the keyless-auth cutover, placed BEFORE the label check so it runs
      # on every staging push regardless of whether any hub deploys. Proves keyless
      # WIF login (prod-deploy@ impersonation) works here. Non-fatal. Next PR: move
      # this into the deploy job and drop the GKE_KEY/SOPS key path.
      - name: Log in to Google Cloud via WIF (canary, non-fatal)
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_DEPLOY_SA }}

      - name: Check for hubs that need deploying from the labels on the merge commit to staging
        run: |
          echo "PR labels: ${{ steps.pr-labels.outputs.labels }}"
          if [[ -n ${GITHUB_PR_LABEL_HUB_IMAGES} || -n ${GITHUB_PR_LABEL_JUPYTERHUB_DEPLOYMENT} ]]; then
            echo "DEPLOY=1" >> "$GITHUB_ENV"
          else
            for label in $(echo -e "${{ steps.pr-labels.outputs.labels }}"); do
              if [[ "$label" == hub-* ]]; then
                echo "DEPLOY=1" >> "$GITHUB_ENV"
              fi
            done
          fi

      - name: Check out the image repo
        if: ${{ env.DEPLOY }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup python
        if: ${{ env.DEPLOY }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Determine hubs to deploy
        id: set-hubs
        run: |
          if [[ -z "$DEPLOY" ]]; then
            echo "hubs=[]" >> "$GITHUB_OUTPUT"
          else
            # `dev` is the dev CLUSTER's hub and must never deploy here. This script
            # deploys every directory under deployments/ whenever a PR carries
            # jupyterhub-deployment or hub-images, and a `hub: dev`/`hub-dev` label
            # sets GITHUB_PR_LABEL_HUB_DEV, which it also reads. Both paths land on
            # the prod cluster. deploy-dev.yaml owns the dev hub.
            hubs=$(python .github/scripts/determine-hub-deployments.py \
                     --ignore gpu-demo rstudio dev \
                   | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "hubs=${hubs}" >> "$GITHUB_OUTPUT"
          fi

  deploy-hubs-to-staging:
    needs: determine-staging-hubs
    if: needs.determine-staging-hubs.outputs.hubs != '[]'
    strategy:
      matrix:
        hub: ${{ fromJson(needs.determine-staging-hubs.outputs.hubs) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the image repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install SOPS
        uses: ./.github/actions/install-sops

      - name: Auth to gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Deploy ${{ matrix.hub }} to staging
        run: |
          echo "Deploying ${{ matrix.hub }} to staging"
          hubploy --verbose deploy --timeout 30m "${{ matrix.hub }}" hub staging

  # ---------------------------------------------------------------------------
  # Prod
  # ---------------------------------------------------------------------------
  determine-prod-hubs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    outputs:
      hubs: ${{ steps.set-hubs.outputs.hubs }}
    steps:
      - name: Get PR labels
        id: pr-labels
        uses: irby/get-labels-on-push@v1.2.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Canary for the keyless-auth cutover, placed BEFORE the label check so it runs
      # on every prod push regardless of whether any hub deploys. Proves keyless
      # WIF login (prod-deploy@ impersonation) works here. Non-fatal. Next PR: move
      # this into the deploy job and drop the GKE_KEY/SOPS key path.
      - name: Log in to Google Cloud via WIF (canary, non-fatal)
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_DEPLOY_SA }}

      - name: Check for hubs that need deploying from the labels on the merge commit to prod
        run: |
          echo "PR labels: ${{ steps.pr-labels.outputs.labels }}"
          if [[ -n ${GITHUB_PR_LABEL_HUB_IMAGES} || -n ${GITHUB_PR_LABEL_JUPYTERHUB_DEPLOYMENT} ]]; then
            echo "DEPLOY=1" >> "$GITHUB_ENV"
          else
            for label in $(echo -e "${{ steps.pr-labels.outputs.labels }}"); do
              if [[ "$label" == hub-* ]]; then
                echo "DEPLOY=1" >> "$GITHUB_ENV"
              fi
            done
          fi

      - name: Check out the image repo
        if: ${{ env.DEPLOY }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup python
        if: ${{ env.DEPLOY }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Determine hubs to deploy
        id: set-hubs
        run: |
          if [[ -z "$DEPLOY" ]]; then
            echo "hubs=[]" >> "$GITHUB_OUTPUT"
          else
            # `dev` is the dev CLUSTER's hub and must never deploy here. This script
            # deploys every directory under deployments/ whenever a PR carries
            # jupyterhub-deployment or hub-images, and a `hub: dev`/`hub-dev` label
            # sets GITHUB_PR_LABEL_HUB_DEV, which it also reads. Both paths land on
            # the prod cluster. deploy-dev.yaml owns the dev hub.
            hubs=$(python .github/scripts/determine-hub-deployments.py \
                     --ignore gpu-demo rstudio dev \
                   | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "hubs=${hubs}" >> "$GITHUB_OUTPUT"
          fi

  deploy-hubs-to-prod:
    needs: determine-prod-hubs
    if: needs.determine-prod-hubs.outputs.hubs != '[]'
    strategy:
      matrix:
        hub: ${{ fromJson(needs.determine-prod-hubs.outputs.hubs) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the image repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install SOPS
        uses: ./.github/actions/install-sops

      - name: Auth to gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Deploy ${{ matrix.hub }} to prod
        run: |
          echo "Deploying ${{ matrix.hub }} to prod"
          hubploy --verbose deploy --timeout 30m "${{ matrix.hub }}" hub prod
