name: Deploy dev jupyterhub-home-nfs chart (helm)
# Installs the home-directory NFS server on the dev cluster with raw helm.
# Called by deploy-dev.yaml after the cluster job, so it can never race the cluster.

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: dev-nfs-helm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev-deploy
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DEV_WIF_PROVIDER }}
          service_account: ${{ vars.DEV_DEPLOY_SA }}

      - name: Get dev cluster credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.DEV_CLUSTER }}
          location: ${{ vars.DEV_ZONE }}
          project_id: ${{ vars.DEV_PROJECT }}

      - name: Deploy the jupyterhub-home-nfs chart
        run: |
          helm dep up jupyterhub-home-nfs
          helm upgrade \
            --install --wait --timeout 10m \
            --create-namespace --namespace=jupyterhub-home-nfs \
            jupyterhub-home-nfs jupyterhub-home-nfs/ \
            -f dev/nfs-values.yaml

      - name: Wait for the NFS server to actually roll out
        run: |
          kubectl rollout status deployment/home-nfs \
            -n jupyterhub-home-nfs --timeout=10m
          kubectl get pods -n jupyterhub-home-nfs
